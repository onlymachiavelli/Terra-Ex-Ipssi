---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true

- name: Deploy nginx site configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/default
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Deploy web page
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ nginx_web_root }}/index.html"
    owner: root
    group: root
    mode: "0644"

- name: Deploy stylesheet
  ansible.builtin.copy:
    src: style.css
    dest: "{{ nginx_web_root }}/style.css"
    owner: root
    group: root
    mode: "0644"

- name: Deploy client-side script
  ansible.builtin.copy:
    src: script.js
    dest: "{{ nginx_web_root }}/script.js"
    owner: root
    group: root
    mode: "0644"

- name: Ensure nginx is started and enabled
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
