name: TF FORMAT CHECK
run-name: ${{ github.actor  }} is running TF FORMAT CHECK
on:
  push:
    branches:
      - main
      - master
env:
  TF_VERSION: "1.14.8"
permissions:
  contents: read
jobs:
  check-tf-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          fetch-depth: 1
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "${{ github.repository  }}"
          fetch-depth: 1
      - run: |
          make tf.fmt.ci
        continue-on-error: false
